name: Pipeline Basico CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Descargar el código del repositorio
    - name: Checkout del codigo
      uses: actions/checkout@v4

    # 1. Compilación / Instalación de dependencias (Ejemplo Node.js)
    - name: 1. Compilacion (Instalar dependencias)
      run: npm install

    # 2. Ejecución de pruebas automatizadas
    - name: 2. Ejecucion de pruebas unitarias
      run: npm test --if-present

    # 3. Despliegue simulado (Imprimir mensaje y simular copiado)
    - name: 3. Despliegue simulado
      run: |
        echo "Iniciando proceso de despliegue..."
        mkdir -p staging
        cp package.json staging/ 2>/dev/null || true
        echo "Despliegue exitoso"
